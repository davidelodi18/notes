<style>
:root{
  --ink:#17211d;
  --ink-soft:#41504a;
  --muted:#7b8a83;
  --line:#d5dcd7;
  --line-soft:#e6eae7;
  --shell:#e9ede9;
  --paper:#ffffff;
  --accent:#2f6f4e;
  --accent-soft:#e4efe8;
  --amber:#a86a1f;
  --amber-soft:#f8efe0;
  --red:#a33c34;
  --radius:6px;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--shell);color:var(--ink);
  font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
#root{height:100%}

/* ── layout ─────────────────────────────────────────── */
.app{display:flex;height:100vh;overflow:hidden}
.col-sections{width:216px;flex:none;background:var(--shell);border-right:1px solid var(--line);display:flex;flex-direction:column}
.col-list{width:296px;flex:none;background:#f4f6f4;border-right:1px solid var(--line);display:flex;flex-direction:column}
.col-doc{flex:1;background:var(--paper);overflow-y:auto;position:relative}

.brand{padding:18px 16px 12px;display:flex;align-items:baseline;gap:8px}
.brand h1{font-family:var(--serif);font-size:21px;font-weight:600;margin:0;letter-spacing:-.01em}
.brand .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;transform:translateY(-3px)}
.brand .dot.off{background:var(--muted)}

.nav{padding:0 8px;overflow-y:auto;flex:1}
.nav-group{margin:6px 0 14px}
.nav-label{font-size:11px;color:var(--muted);padding:6px 8px;letter-spacing:.02em}
.nav-item{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:7px 9px;border:0;background:transparent;border-radius:var(--radius);
  color:var(--ink-soft);margin-bottom:1px;
}
.nav-item:hover{background:#dfe5e0}
.nav-item.on{background:var(--paper);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(23,33,29,.07)}
.nav-item .chip{width:9px;height:9px;border-radius:2px;flex:none}
.nav-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .n{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav-item .edit{opacity:0;font-size:12px;color:var(--muted);padding:0 2px}
.nav-item:hover .edit{opacity:1}
.nav-add{display:flex;align-items:center;gap:8px;width:100%;padding:7px 9px;border:1px dashed var(--line);
  background:transparent;border-radius:var(--radius);color:var(--muted);margin-top:4px}
.nav-add:hover{border-color:var(--accent);color:var(--accent)}
.sidebar-foot{padding:10px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.sidebar-foot button{border:0;background:none;color:var(--muted);text-decoration:underline;padding:0}

/* ── lista documenti ────────────────────────────────── */
.list-head{padding:14px 14px 10px;border-bottom:1px solid var(--line-soft)}
.list-head h2{font-family:var(--serif);font-size:18px;margin:0 0 3px;font-weight:600}
.list-head p{margin:0;font-size:12px;color:var(--muted)}
.search{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--paper);margin-top:10px;outline:none}
.search:focus{border-color:var(--accent)}
.new-row{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line-soft)}
.btn{border:1px solid var(--line);background:var(--paper);padding:6px 11px;border-radius:var(--radius);color:var(--ink-soft)}
.btn:hover{border-color:var(--ink-soft);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#255840;border-color:#255840;color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--line-soft);color:var(--ink)}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.btn.sm{padding:4px 8px;font-size:12.5px}
.list{flex:1;overflow-y:auto;padding:6px}
.card{
  display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;
  padding:10px 11px;border-radius:var(--radius);margin-bottom:2px;color:inherit;
}
.card:hover{background:#eaefeb}
.card.on{background:var(--paper);border-color:var(--line);box-shadow:0 1px 3px rgba(23,33,29,.08)}
.card .t{font-weight:500;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .m{font-size:12px;color:var(--muted);display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;padding:1px 6px;border-radius:20px;border:1px solid var(--line)}
.tag.meet{background:var(--accent-soft);border-color:#c9ded2;color:#255840}
.tag.todo{background:var(--amber-soft);border-color:#ecd9b8;color:var(--amber)}
.empty{padding:30px 18px;color:var(--muted);text-align:center;font-size:13px}
.empty strong{display:block;color:var(--ink-soft);font-weight:500;margin-bottom:4px}

/* ── documento ──────────────────────────────────────── */
.doc-bar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line-soft);padding:9px 28px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.doc-bar .spacer{flex:1}
.saved{font-size:12px;color:var(--muted);min-width:74px}
.doc{max-width:760px;margin:0 auto;padding:26px 28px 100px}
.title-in{width:100%;border:0;outline:none;font-family:var(--serif);font-size:32px;font-weight:600;
  letter-spacing:-.015em;padding:0;margin:0 0 6px;line-height:1.2}
.title-in::placeholder{color:#c3ccc7}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 14px;
  padding:14px 0 16px;border-bottom:1px solid var(--line-soft);margin-bottom:20px}
.f label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:6px 8px;outline:none;background:#fbfcfb}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);background:#fff}
.sec-h{display:flex;align-items:center;gap:10px;margin:26px 0 10px}
.sec-h h3{font-family:var(--serif);font-size:19px;font-weight:600;margin:0}
.sec-h .rule{flex:1;height:1px;background:var(--line-soft)}
.row{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.row:last-of-type{border-bottom:0}
.row .num{font-family:var(--serif);color:var(--muted);width:20px;flex:none;padding-top:6px;font-variant-numeric:tabular-nums}
.row .body{flex:1;min-width:0}
.row input.line{width:100%;border:0;border-bottom:1px solid transparent;background:transparent;padding:5px 2px;outline:none}
.row input.line:focus{border-bottom-color:var(--accent)}
.row textarea.line{width:100%;border:0;background:transparent;padding:4px 2px;outline:none;resize:vertical;
  min-height:38px;color:var(--ink-soft);font-size:13.5px}
.row textarea.line.title{min-height:0;resize:none;overflow:hidden;color:var(--ink);font-size:14px;
  line-height:1.45;padding:5px 2px;border-bottom:1px solid transparent}
.row textarea.line.title:focus{border-bottom-color:var(--accent)}
.row textarea.line.nota{min-height:0;resize:none;overflow:hidden;font-size:13px;color:var(--ink-soft);
  line-height:1.5;padding:3px 2px;margin-top:1px}
.row textarea.line.nota::placeholder{color:#c9d1cc}
.row .sub{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.row .sub input{border:1px solid var(--line-soft);border-radius:var(--radius);padding:3px 7px;font-size:12.5px;background:#fbfcfb;flex:1 1 120px;min-width:0;max-width:180px}
.row .x{border:0;background:none;color:#c3ccc7;padding:6px 4px;line-height:1}
.row .x:hover{color:var(--red)}
.mover{display:flex;flex-direction:column;gap:1px;flex:none;padding-top:2px}
.mv{border:0;background:none;color:#c3ccc7;padding:2px 5px;line-height:1;font-size:12px;border-radius:3px}
.mv:hover:not(:disabled){background:var(--line-soft);color:var(--ink)}
.mv:disabled{opacity:.25;cursor:default}
.row.done .body{opacity:.5;text-decoration:line-through}
.row.macro{border-bottom:0;padding:14px 0 4px;align-items:flex-start}
.row.macro .macro-t{font-weight:600;font-size:15px;color:var(--ink)}
.row.macro .macro-meta{display:flex;gap:12px;align-items:center;margin-top:2px;flex-wrap:wrap}
.caret{border:0;background:none;color:var(--muted);padding:6px 2px 0 0;line-height:1;font-size:12px;flex:none;width:18px}
.caret:disabled{opacity:.25;cursor:default}
.caret:hover:not(:disabled){color:var(--accent)}
.row.macro.chiusa{border-bottom:1px solid var(--line-soft);padding-bottom:12px}
.row.macro .conta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.row.macro .conta.ok{color:var(--accent)}
.row.macro.compl .macro-t{color:var(--muted)}
.row.sub-row{margin-left:20px;border-left:2px solid var(--line-soft);padding-left:12px;border-bottom:1px solid var(--line-soft)}
.add-row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.add-line.alt{color:var(--muted)}
.add-line.alt:hover{color:var(--accent)}
.add-line{border:0;background:none;color:var(--accent);padding:8px 0;text-align:left}
.add-line:hover{text-decoration:underline}
.chk{width:16px;height:16px;margin-top:8px;flex:none;accent-color:var(--accent)}

.rt-tools{display:flex;gap:2px;padding:6px 0 8px;border-bottom:1px solid var(--line-soft);margin-bottom:10px;
  flex-wrap:wrap;position:sticky;top:46px;z-index:8;background:rgba(255,255,255,.96);backdrop-filter:blur(6px)}
.rt-tools button{border:0;background:none;padding:4px 8px;border-radius:4px;color:var(--muted);min-width:30px}
.rt-tools button:hover{background:var(--line-soft);color:var(--ink)}
.pal-wrap{position:relative;display:inline-flex}
.ink-a{border-bottom:3px solid #a33c34;padding-bottom:1px;font-weight:600}
.ink-h{background:#fcf3b0;padding:0 3px;border-radius:2px;font-weight:600}
.pal{position:absolute;top:100%;left:0;margin-top:5px;background:var(--paper);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:0 8px 24px rgba(23,33,29,.18);padding:9px;z-index:30;min-width:150px}
.pal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.pal-sw{width:26px;height:26px;border-radius:5px;border:1px solid transparent;padding:0}
.pal-sw:hover{outline:2px solid var(--ink);outline-offset:1px}
.pal-tit{font-size:11px;color:var(--muted);margin:2px 0 5px;letter-spacing:.02em}
.pal-custom{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid var(--line);
  background:var(--paper);border-radius:var(--radius);padding:7px 9px;font-size:12.5px;color:var(--ink-soft);margin-bottom:2px}
.pal-custom:hover{border-color:var(--accent);color:var(--accent)}
.ruota{width:15px;height:15px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.12);
  background:conic-gradient(#e05a4f,#e8a13a,#ddd23f,#5bb35f,#4aa8c4,#5a6fc0,#9a5ec0,#d24f8e,#e05a4f)}
.pal-clear{display:block;width:100%;text-align:left;border:0;background:none;color:var(--muted);
  font-size:12.5px;padding:5px 4px;border-top:1px solid var(--line-soft);margin-top:2px}
.pal-clear:hover{color:var(--ink)}
.pal-riga{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 8px;
  border-radius:4px;font-size:13px;white-space:nowrap}
.pal-riga:hover{background:var(--line-soft)}
.rt{
  min-height:220px;outline:none;font-family:var(--serif);font-size:17px;line-height:1.65;color:var(--ink);
}
.rt:empty:before{content:attr(data-ph);color:#c3ccc7}
.rt h2{font-size:21px;margin:20px 0 6px}
.rt h3{font-size:18px;margin:16px 0 4px}
.rt ul,.rt ol{padding-left:22px;margin:8px 0}
.rt li{margin:3px 0}
.rt blockquote{border-left:2px solid var(--accent);margin:12px 0;padding-left:14px;color:var(--ink-soft);font-style:italic}
.rt a{color:var(--accent)}
.rt table{border-collapse:collapse;width:100%;margin:14px 0;font-family:var(--sans);font-size:13.5px}
.rt table td,.rt table th{border:1px solid var(--line);padding:6px 9px;vertical-align:top;min-width:40px}
.rt table th{background:var(--shell);text-align:left;font-weight:600}
.rt table td:focus,.rt table th:focus{outline:2px solid var(--accent);outline-offset:-2px}
.rt figure{margin:16px 0;text-align:center}
.rt img{max-width:100%;height:auto;border-radius:4px;display:block;margin:0 auto}
.rt figcaption{font-family:var(--sans);font-size:12.5px;color:var(--muted);margin-top:5px}
.rt-wrap{position:relative}
.rt-ctx{position:absolute;z-index:7;display:flex;gap:3px;align-items:center;padding:4px;background:var(--paper);
  border:1px solid #c9ded2;border-radius:var(--radius);box-shadow:0 3px 12px rgba(23,33,29,.14);
  font-size:12.5px;color:#255840;white-space:nowrap}
.rt-ctx button{border:1px solid transparent;background:var(--accent-soft);border-radius:4px;padding:4px 9px;
  font-size:12.5px;color:#255840;line-height:1.2}
.rt-ctx button:hover{background:#255840;color:#fff}
.rt-ctx{flex-wrap:wrap;max-width:min(420px,92vw)}
.rt-ctx .sep{width:1px;align-self:stretch;background:#d5e3da;margin:0 2px}
.ink-cell{display:inline-block;width:13px;height:13px;border-radius:3px;border:1px solid #c9ded2;
  background:linear-gradient(135deg,#fcf3b0 50%,#d6e8f5 50%);vertical-align:-2px}
.rt-ctx .pal{top:100%;left:0;margin-top:6px}
.rt-ctx button.attivo{background:var(--accent);color:#fff;box-shadow:0 0 0 2px rgba(47,111,78,.25)}
.rt-ctx button.del{background:#f7e9e8;color:var(--red)}
.rt-ctx button.del:hover{background:var(--red);color:#fff}
.peso{font-size:12px;color:var(--amber);padding:6px 0}

/* cruscotto spazio */
.spazio-hero{border:1px solid var(--line);border-radius:8px;padding:20px;margin:18px 0 22px;background:#fbfcfb}
.spazio-num{font-family:var(--serif);font-size:34px;line-height:1;letter-spacing:-.02em}
.spazio-num small{font-family:var(--sans);font-size:14px;color:var(--muted);letter-spacing:0;margin-left:6px}
.barra{height:9px;background:var(--line-soft);border-radius:20px;overflow:hidden;margin:14px 0 8px}
.barra i{display:block;height:100%;background:var(--accent);border-radius:20px}
.barra i.warn{background:var(--amber)}
.barra i.alarm{background:var(--red)}
.spazio-sub{font-size:12.5px;color:var(--muted)}
.quote{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0 6px}
.quota{border:1px solid var(--line-soft);border-radius:var(--radius);padding:12px 14px}
.quota .k{font-size:11.5px;color:var(--muted);margin-bottom:3px}
.quota .v{font-size:17px;font-variant-numeric:tabular-nums}
.top-doc{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.top-doc .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-doc .p{font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:13px;white-space:nowrap}
.top-doc .img{font-size:11.5px;color:var(--amber);white-space:nowrap}
.anteprima{border:1px solid var(--line);border-radius:var(--radius);padding:16px;background:#fff;
  margin-top:16px;color:#17211d;max-height:210px;overflow:auto}
.nota-box{background:var(--accent-soft);border-radius:var(--radius);padding:12px 14px;font-size:12.5px;
  color:#255840;margin-top:20px;line-height:1.55}

/* ── azioni globali ─────────────────────────────────── */
.actions-wrap{max-width:820px;margin:0 auto;padding:26px 28px 80px}
.act{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.act .who{font-size:12.5px;color:var(--muted)}
.act .src{font-size:12px;color:var(--muted)}
.act .due{font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink-soft)}
.act .due.late{color:var(--red);font-weight:500}
.act .due.soon{color:var(--amber)}
.link-btn{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;font-size:12px}

/* ── modali ─────────────────────────────────────────── */
.overlay{position:fixed;inset:0;background:rgba(23,33,29,.36);display:flex;align-items:center;
  justify-content:center;z-index:50;padding:18px}
.modal{background:var(--paper);border-radius:8px;padding:22px;width:100%;max-width:420px;box-shadow:0 16px 44px rgba(23,33,29,.24)}
.modal h3{font-family:var(--serif);font-size:20px;margin:0 0 14px;font-weight:600}
.modal .f{margin-bottom:12px}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:5px;border:2px solid transparent}
.sw.on{border-color:var(--ink)}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}

.login{max-width:340px;margin:14vh auto;background:var(--paper);padding:28px;border-radius:8px;border:1px solid var(--line)}
.login h1{font-family:var(--serif);font-size:26px;margin:0 0 4px}
.login p{margin:0 0 18px;color:var(--muted);font-size:13px}
.err{color:var(--red);font-size:12.5px;margin-top:10px}

.mobile-back{display:none}
.doc-menu{position:relative;display:none}
.doc-menu-pop{position:absolute;right:0;top:100%;margin-top:4px;background:var(--paper);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:0 8px 24px rgba(23,33,29,.18);z-index:20;min-width:150px;overflow:hidden}
.doc-menu-pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 14px}
.doc-menu-pop button:hover{background:var(--line-soft)}
.doc-menu-pop button.danger{color:var(--red)}

@media(max-width:900px){
  html{-webkit-text-size-adjust:100%}
  body{overflow-x:hidden}
  .app{display:block;height:auto;overflow:visible}
  .col-sections,.col-list,.col-doc{width:auto;border-right:0;height:auto;max-width:100%}
  .col-sections{border-bottom:1px solid var(--line)}
  .col-list{border-bottom:1px solid var(--line)}
  .hide-m{display:none!important}
  .mobile-back{display:inline-block}
  .doc-menu{display:inline-block}
  .hide-mobile{display:none!important}

/* ═══════════ utilità documento ═══════════ */
const emptyDoc = (sezioneId, tipo, tpl) => ({

const stripHtml = h => (h||'').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim();
const fmtDate = d => { if(!d) return ''; const [y,m,g]=d.split('-'); return `${g}/${m}/${y}`; };
const daysTo = d => { if(!d) return null; return Math.round((new Date(d+'T00:00:00') - new Date(today()+'T00:00:00'))/86400000); };

/* tabella delle attività per gli export, con le macro come righe di raggruppamento */
function azioniHtml(azioni){
  const e = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const az = azioni || [];
  if(!az.length) return '';
  const riga = a => `<tr><td>${e(a.testo)}${a.note && a.note.trim() ? `<div class="note">${e(a.note).replace(/\n/g,'<br>')}</div>` : ''}</td><td>${e(a.responsabile)}</td><td>${fmtDate(a.scadenza)}</td><td>${a.fatto?'Chiusa':'Aperta'}</td></tr>`;
  let h = '<h2>Attività</h2><table class="grid"><tr><th>Attività</th><th>Responsabile</th><th>Scadenza</th><th>Stato</th></tr>';
  az.forEach(a=>{
    if(a.macro){
      const f = az.filter(x=>!x.macro && x.parentId===a.id);
      const fatte = f.filter(x=>x.fatto).length;
      const nota = a.note && a.note.trim() ? `<div class="note">${e(a.note).replace(/\n/g,'<br>')}</div>` : '';
      h += `<tr><td colspan="4" class="macro-cell"><strong>${e(a.testo)}</strong>${f.length?` — ${fatte} di ${f.length} chiuse`:''}${nota}</td></tr>`;
      f.forEach(c=>{ h += riga(c); });
    } else if(!a.parentId){
      h += riga(a);
    }
  });
  return h + '</table>';
}

/* ═══════════ generazione HTML per export ═══════════ */
function docToHtml(doc, sezione){
  const e = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let h = '';
  h += `<p class="kicker">${e(sezione? sezione.nome : '')}</p>`;
  h += `<h1>${e(doc.titolo)||'Senza titolo'}</h1>`;

  if(doc.tipo==='riunione'){
    const meta = [];
    if(doc.data) meta.push(['Data', fmtDate(doc.data) + (doc.ora? ' — '+doc.ora : '')]);
    if(doc.luogo) meta.push(['Luogo', doc.luogo]);
    if(doc.partecipanti) meta.push(['Partecipanti', doc.partecipanti]);
    if(doc.obiettivo) meta.push(['Obiettivo', doc.obiettivo]);
    if(meta.length){
      h += '<table class="meta">' + meta.map(([k,v])=>`<tr><td class="k">${e(k)}</td><td>${e(v)}</td></tr>`).join('') + '</table>';
    }
    if(doc.agenda && doc.agenda.length){
      h += '<h2>Ordine del giorno</h2><ol>';
      doc.agenda.forEach(p=>{
        h += `<li><strong>${e(p.titolo)}</strong>` + (p.note? `<div class="note">${e(p.note).replace(/\n/g,'<br>')}</div>`:'') + '</li>';
      });
      h += '</ol>';
    }
    if(doc.corpo && stripHtml(doc.corpo)){
      h += '<h2>Note</h2><div>'+doc.corpo+'</div>';
    }
    if(doc.decisioni && doc.decisioni.length){
      h += '<h2>Decisioni</h2><ul>' + doc.decisioni.map(d=>`<li>${e(d.testo)}</li>`).join('') + '</ul>';
    }
    if(doc.azioni && doc.azioni.length){
      h += azioniHtml(doc.azioni);
    }
  } else {
    if(doc.data || doc.obiettivo){
      const meta=[];
      if(doc.data) meta.push(['Data', fmtDate(doc.data)]);
      if(doc.obiettivo) meta.push(['In sintesi', doc.obiettivo]);
      h += '<table class="meta">' + meta.map(([k,v])=>`<tr><td class="k">${e(k)}</td><td>${e(v)}</td></tr>`).join('') + '</table>';
    }
    h += '<div>'+(doc.corpo||'')+'</div>';
    if(doc.azioni && doc.azioni.length){
      h += azioniHtml(doc.azioni);
    }
  }
  return h;
}

function fullHtml(title, inner, fmt){

function pdfDomCss(o){

function loadScript(src){
  return new Promise((res,rej)=>{
    if(document.querySelector(`script[src="${src}"]`)) return res();
    const s = document.createElement('script');
    s.src = src; s.onload = () => res(); s.onerror = () => rej(new Error('CDN non raggiungibile'));
    document.head.appendChild(s);
  });
}

/* stampa dal browser: usata solo come ripiego */
function printFallback(title, inner, fmt){
  const f = document.createElement('iframe');
  f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
  document.body.appendChild(f);
  const d = f.contentWindow.document;
  d.open(); d.write(fullHtml(title, inner, fmt)); d.close();
  setTimeout(()=>{ f.contentWindow.focus(); f.contentWindow.print(); setTimeout(()=>f.remove(), 1200); }, 350);
}

/* true se il canvas contiene solo pixel bianchi/trasparenti */
function canvasVuoto(c){
  try{
    const ctx = c.getContext('2d');
    const W = c.width, H = c.height;
    if(!W || !H) return true;
    const passo = 7;   // campiono una griglia di punti, non tutti i pixel
    for(let y=0; y<H; y+=Math.max(1,Math.floor(H/passo))){
      const riga = ctx.getImageData(0, Math.min(y,H-1), W, 1).data;
      for(let x=0; x<W*4; x+=4){
        const r=riga[x], g=riga[x+1], b=riga[x+2], a=riga[x+3];
        if(a>10 && (r<245 || g<245 || b<245)) return false;
      }
    }
    return true;
  }catch(e){ return false; }   // nel dubbio, procedo
}

async function exportPdf(title, inner, filename, fmt){
  const o = fmt || FORMATO_DEF;
  const nome = ((filename||title||'documento').replace(/[^\w\sàèéìòùÀÈÉÌÒÙ\-]/gi,'').trim() || 'documento') + '.pdf';
  try{
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js');
    if(!window.html2pdf) throw new Error('libreria non disponibile');

    let st = document.getElementById('pdf-style');
    if(!st){ st = document.createElement('style'); st.id = 'pdf-style'; document.head.appendChild(st); }
    st.textContent = pdfDomCss(o);

    const wrapped = `<div class="pdfdoc">${inner}</div>`;
    const mm = MARGINI[o.margini] || MARGINI.normali;
    const opt = {
      margin: [mm[0], mm[1], mm[0]+2, mm[1]],
      filename: nome,
      image: { type:'jpeg', quality:0.96 },
      html2canvas: { scale: 2, useCORS: true, backgroundColor:'#ffffff', logging:false, scrollX:0, scrollY:0 },
      jsPDF: { unit:'mm', format:'a4', orientation:'portrait' },
      pagebreak: { mode:['css','legacy'], avoid:['tr','figure','li','h2','h3'] }
    };

    let w = window.html2pdf().set(opt).from(wrapped, 'string');
    w = w.toContainer().toCanvas();
    await w;

    const canvas = w.prop && w.prop.canvas;
    if(canvas && canvasVuoto(canvas)) throw new Error('pagina generata vuota');

    await w.toPdf().save();
    return true;
  }catch(e){
    console.error('PDF diretto non riuscito:', e);
    alert('Non sono riuscito a generare il PDF direttamente. Apro la stampa: da lì scegli "Salva come PDF".');
    printFallback(title, inner, o);
    return false;
  }
}

function exportWord(filename, title, inner, fmt){
  const o = fmt || FORMATO_DEF;
  const m = MARGINI[o.margini] || MARGINI.normali;
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8"><title>${title}</title>
<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]-->
<style>@page{size:A4;margin:${m[0]}mm ${m[1]}mm}${printCss(o)}</style></head><body>${inner}</body></html>`;
  const blob = new Blob(['\ufeff', html], {type:'application/msword'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename.replace(/[^\w\sàèéìòù\-]/gi,'').trim() + '.doc';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 500);
}



/* ═══════════ compressione immagini ═══════════ */
function compressImage(file, maxPx=1200, quality=0.78){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        let {width:w, height:h} = img;
        if(w>maxPx || h>maxPx){ const k = maxPx/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
        const c = document.createElement('canvas');
        c.width=w; c.height=h;
        const ctx = c.getContext('2d');
        ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => rej(new Error('Immagine non leggibile'));
      img.src = r.result;
    };
    r.onerror = () => rej(new Error('Lettura non riuscita'));
    r.readAsDataURL(file);
  });
}

};

function Palette({colori, onPick, onClear, etichetta, evid, recenti, onCustom}){

        <>
          <div className="pal-tit">Usati di recente</div>
          <div className="pal-grid">
            {recenti.map(v=>(
              <button key={v} className="pal-sw" title={v} style={{background:v, borderColor:'#d5dcd7'}}
                onClick={()=>onPick(v)}/>
            ))}
          </div>
        </>
      )}

      <button className="pal-custom" onClick={onCustom}>
        <span className="ruota"></span> Scegli un colore…
      </button>
      <button className="pal-clear" onClick={onClear}>{etichetta}</button>
    </div>
  );
}

function RichText({value, onChange, placeholder, docKey}){
  const ref = useRef(null);
  const fileRef = useRef(null);
  const [inTable,setInTable] = useState(false);
  const [busy,setBusy] = useState('');
  const [pal,setPal] = useState(null);   // 'testo' | 'evid' | 'riga' | null
  const colorRef = useRef(null);
  const targetRef = useRef('testo');
  const [recenti,setRecenti] = useState(()=> local.get('quaderno:colori') || []);
  const ricorda = (v) => {
    setRecenti(p=>{
      const n = [v, ...p.filter(x=>x!==v)].slice(0,8);
      local.set('quaderno:colori', n);
      return n;
    });
  };

  useEffect(()=>{ if(ref.current && ref.current.innerHTML !== (value||'')) ref.current.innerHTML = value||''; }, [docKey]);
  useEffect(()=>{
    if(!inTable) return;
    let att = false;
    const h = () => {
      if(att) return;
      att = true;
      requestAnimationFrame(()=>{ att = false; checkCtx(); });
    };
    window.addEventListener('scroll', h, true);
    window.addEventListener('resize', h);
    return ()=>{ window.removeEventListener('scroll', h, true); window.removeEventListener('resize', h); };
  },[inTable]);
  useEffect(()=>{
    if(!pal) return;
    const h = () => setPal(null);
    document.addEventListener('click', h);
    return () => document.removeEventListener('click', h);
  },[pal]);

  const emit = () => onChange(ref.current.innerHTML);
  const cmd = (c,v)=>{ ref.current.focus(); document.execCommand(c,false,v||null); emit(); };

  /* il tocco su un pulsante fa perdere la selezione: la salvo e la rimetto */
  const rangeRef = useRef(null);
  const salvaRange = () => {
    const sel = window.getSelection();
    if(sel && sel.rangeCount && ref.current && ref.current.contains(sel.anchorNode)){
      rangeRef.current = sel.getRangeAt(0).cloneRange();
    }
  };
  const ripristinaRange = () => {
    const r = rangeRef.current;
    if(!r) return;
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(r);
  };

  /* colore del testo ed evidenziatore: servono gli stili CSS, non i vecchi tag <font> */
  const cmdCss = (c,v)=>{
    ref.current.focus(); ripristinaRange();
    try{ document.execCommand('styleWithCSS', false, true); }catch(e){}
    document.execCommand(c, false, v);
    try{ document.execCommand('styleWithCSS', false, false); }catch(e){}
    emit(); setPal(null);
  };
  const apriSelettore = (target) => {
    targetRef.current = target;
    salvaRange();
    const attuale = target==='evid' ? '#fcf3b0' : '#17211d';
    colorRef.current.value = attuale;
    colorRef.current.click();
  };
  const coloreScelto = (v) => {
    ricorda(v);
    if(targetRef.current==='cella') coloraCelle(v);
    else if(targetRef.current==='evid') evidenzia(v);
    else cmdCss('foreColor', v);
  };

  const evidenzia = (v) => {
    ref.current.focus(); ripristinaRange();
    try{ document.execCommand('styleWithCSS', false, true); }catch(e){}
    if(!document.execCommand('hiliteColor', false, v)) document.execCommand('backColor', false, v);
    try{ document.execCommand('styleWithCSS', false, false); }catch(e){}
    emit(); setPal(null);
  };

  /* blocchi (paragrafi, voci di elenco, titoli) toccati dalla selezione */
  const blocchiSelezionati = () => {
    const sel = window.getSelection();
    if(!sel || !sel.rangeCount || !ref.current.contains(sel.anchorNode)) return [];
    const su = (n) => {
      while(n && n!==ref.current){
        if(n.nodeType===1 && /^(P|DIV|LI|H2|H3|BLOCKQUOTE|TD|TH)$/.test(n.tagName)) return n;
        n = n.parentNode;
      }
      return null;
    };
    const a = su(sel.anchorNode), b = su(sel.focusNode);
    if(!a && !b) return [ref.current];
    if(a===b || !b) return [a].filter(Boolean);
    const tutti = Array.from(ref.current.querySelectorAll('p,div,li,h2,h3,blockquote'));
    const i = tutti.indexOf(a), j = tutti.indexOf(b);
    if(i<0 || j<0) return [a,b].filter(Boolean);
    return tutti.slice(Math.min(i,j), Math.max(i,j)+1);
  };

  const setInterlinea = (v) => {
    ref.current.focus(); ripristinaRange();
    const bl = blocchiSelezionati();
    if(!bl.length){ setPal(null); return; }
    bl.forEach(el=>{ if(v) el.style.lineHeight = v; else el.style.removeProperty('line-height'); });
    emit(); setPal(null); ref.current.focus();
  };

  /* "- " oppure "1. " a inizio riga diventano un elenco */
  const scorciatoiaElenco = (e) => {
    if(e.key !== ' ') return false;
    const sel = window.getSelection();
    if(!sel || !sel.rangeCount) return false;
    const n = sel.anchorNode;
    if(!n || n.nodeType !== 3) return false;
    if(n.parentElement && n.parentElement.closest('li')) return false;   // già in un elenco
    const prima = n.textContent.slice(0, sel.anchorOffset);
    const puntato = /^\s*[-*•]$/.test(prima);
    const numerato = /^\s*(1[.)]|1)$/.test(prima);
    if(!puntato && !numerato) return false;
    e.preventDefault();
    n.textContent = n.textContent.slice(sel.anchorOffset);   // via il segno digitato
    const r = document.createRange(); r.setStart(n, 0); r.collapse(true);
    sel.removeAllRanges(); sel.addRange(r);
    document.execCommand(puntato ? 'insertUnorderedList' : 'insertOrderedList');
    emit();
    return true;
  };

  const cellFromSelection = () => {
    const s = window.getSelection();
    if(!s || !s.anchorNode || !ref.current.contains(s.anchorNode)) return null;
    let n = s.anchorNode;
    while(n && n!==ref.current){
      if(n.nodeType===1 && (n.tagName==='TD'||n.tagName==='TH')) return n;
      n = n.parentNode;
    }
    return null;
  };
  const wrapRef = useRef(null);
  const [tblBox,setTblBox] = useState(null);   // dove disegnare i comandi della tabella

  const checkCtx = () => {
    const cell = cellFromSelection();
    if(cell) cellaRef.current = cell;
    setInTable(!!cell);
    if(!cell){ setTblBox(null); return; }
    const tab = cell.closest('table');
    if(!tab || !wrapRef.current){ setTblBox(null); return; }
    const t = tab.getBoundingClientRect();
    const w = wrapRef.current.getBoundingClientRect();
    const inTesta = !!cell.closest('thead') || cell.tagName === 'TH';
    // sopra la tabella serve spazio libero: sotto la barra strumenti (~90px dal bordo alto)
    const spazioSopra = t.top > 130;
    const metti = (!inTesta && spazioSopra) ? (t.top - w.top - 40) : (t.bottom - w.top + 8);
    setTblBox({ top: metti, left: Math.max(0, t.left - w.left) });
  };

  /* spostarsi tra le celle come in un foglio di calcolo */
  const celleDi = (tab) => Array.from(tab.querySelectorAll('tr'));
  const vaiA = (cell) => {
    if(!cell) return;
    const r = document.createRange();
    r.selectNodeContents(cell); r.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(r);
    cell.scrollIntoView({block:'nearest', inline:'nearest'});
    setTimeout(checkCtx, 0);
  };
  const nuovaRigaIn = (tab, modello) => {
    const tr = document.createElement('tr');
    for(let i=0;i<modello.children.length;i++){ const td=document.createElement('td'); td.innerHTML='<br>'; tr.appendChild(td); }
    let corpo = tab.querySelector('tbody');
    if(!corpo){ corpo = document.createElement('tbody'); tab.appendChild(corpo); }
    corpo.appendChild(tr);
    emit();
    return tr;
  };
  /* il cursore è all'inizio o alla fine del contenuto della cella? */
  const aiBordi = (cell) => {
    const sel = window.getSelection();
    if(!sel || !sel.rangeCount) return {inizio:false, fine:false};
    const r = sel.getRangeAt(0);
    const tutto = document.createRange();
    tutto.selectNodeContents(cell);
    const inizio = r.collapsed && r.compareBoundaryPoints(Range.START_TO_START, tutto) <= 0;
    const fine = r.collapsed && r.compareBoundaryPoints(Range.END_TO_END, tutto) >= 0;
    return {inizio, fine};
  };

  /* unisci le celle selezionate (stessa riga) e dividi */
  const unisciCelle = () => {
    const celle = celleCoinvolte();
    if(celle.length < 2){ alert('Seleziona almeno due celle, trascinando sopra di esse.'); return; }
    const riga = celle[0].parentNode;
    if(!celle.every(c=>c.parentNode===riga)){ alert('Per ora unisco solo celle della stessa riga.'); return; }
    const prima = celle[0];
    prima.colSpan = celle.reduce((n,c)=>n + (c.colSpan||1), 0);
    const testi = celle.map(c=>c.innerHTML.replace(/^<br>$/,'').trim()).filter(Boolean);
    prima.innerHTML = testi.length ? testi.join(' ') : '<br>';
    celle.slice(1).forEach(c=>c.remove());
    emit(); vaiA(prima);
  };
  const dividiCella = () => {
    const c = cellaAttiva(); if(!c) return;
    const n = c.colSpan || 1;
    if(n < 2){ alert('Questa cella non è unita.'); return; }
    c.colSpan = 1;
    for(let i=1;i<n;i++){
      const td = document.createElement(c.tagName === 'TH' ? 'th' : 'td');
      td.innerHTML = '<br>';
      c.parentNode.insertBefore(td, c.nextSibling);
    }
    emit(); vaiA(c);
  };

  /* copia formato: prende l'aspetto di una cella e lo applica alle altre */
  const [fmtPreso,setFmtPreso] = useState(false);
  const fmtRef = useRef(null);
  const copiaFormato = () => {
    const c = cellaAttiva(); if(!c) return;
    const st = window.getComputedStyle(c);
    fmtRef.current = {
      backgroundColor: c.style.backgroundColor || '',
      width: c.style.width || '',
      textAlign: c.style.textAlign || '',
      fontWeight: st.fontWeight,
      color: c.style.color || ''
    };
    setFmtPreso(true);
  };
  const incollaFormato = () => {
    if(!fmtRef.current){ copiaFormato(); return; }
    celleCoinvolte().forEach(td=>{
      Object.entries(fmtRef.current).forEach(([k,v])=>{ if(v) td.style[k] = v; else td.style.removeProperty(k.replace(/[A-Z]/g, m=>'-'+m.toLowerCase())); });
    });
    emit(); setFmtPreso(false);
  };

  const navigaTabella = (e) => {
    const cell = cellFromSelection();
    if(!cell) return false;
    const tab = cell.closest('table');
    const riga = cell.parentNode;
    const righe = celleDi(tab);
    const ri = righe.indexOf(riga);
    const ci = Array.prototype.indexOf.call(riga.children, cell);

    if(e.key === 'Tab'){
      e.preventDefault();
      if(e.shiftKey){
        const prec = cell.previousElementSibling
          || (righe[ri-1] && righe[ri-1].children[righe[ri-1].children.length-1]);
        vaiA(prec);
      } else {
        let succ = cell.nextElementSibling || (righe[ri+1] && righe[ri+1].children[0]);
        if(!succ) succ = nuovaRigaIn(tab, riga).children[0];   // in fondo: nuova riga
        vaiA(succ);
      }
      return true;
    }
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      let sotto = righe[ri+1] && righe[ri+1].children[ci];
      if(!sotto) sotto = nuovaRigaIn(tab, riga).children[ci];
      vaiA(sotto);
      return true;
    }

    /* frecce su e giù: cambio cella, come in un foglio di calcolo */
    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      const giu = e.key === 'ArrowDown';
      const vicina = righe[ri + (giu?1:-1)];
      if(vicina && vicina.children[ci]){ e.preventDefault(); vaiA(vicina.children[ci]); return true; }
      if(!vicina && giu){ e.preventDefault(); vaiA(nuovaRigaIn(tab, riga).children[ci]); return true; }
      return false;   // fuori dalla tabella: lascio fare al browser
    }

    /* frecce destra e sinistra: nel testo, e cambiano cella quando sono al bordo */
    if(e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
      const b = aiBordi(cell);
      if(e.key === 'ArrowRight' && b.fine){
        const succ = cell.nextElementSibling || (righe[ri+1] && righe[ri+1].children[0]);
        if(succ){ e.preventDefault(); vaiA(succ); return true; }
      }
      if(e.key === 'ArrowLeft' && b.inizio){
        const prec = cell.previousElementSibling
          || (righe[ri-1] && righe[ri-1].children[righe[ri-1].children.length-1]);
        if(prec){ e.preventDefault(); vaiA(prec); return true; }
      }
      return false;
    }

    /* Ctrl/Cmd con + e −: righe; aggiungendo Maiusc: colonne */
    if((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=' )){
      e.preventDefault();
      const piu = (e.key === '+' || e.key === '=');
      if(e.shiftKey){ piu ? addCol() : delCol(); } else { piu ? addRow() : delRow(); }
      return true;
    }

    return false;
  };

  const insertTable = () => {
    const r = parseInt(prompt('Quante righe? (esclusa l\'intestazione)','3'),10);
    if(!r || r<1) return;
    const c = parseInt(prompt('Quante colonne?','3'),10);
    if(!c || c<1) return;
    let h = '<table><thead><tr>';
    for(let j=0;j<c;j++) h += '<th>Colonna '+(j+1)+'</th>';
    h += '</tr></thead><tbody>';
    for(let i=0;i<r;i++){ h += '<tr>'; for(let j=0;j<c;j++) h += '<td><br></td>'; h += '</tr>'; }
    h += '</tbody></table><p><br></p>';
    cmd('insertHTML', h);
  };

  const cellaAttiva = () => cellFromSelection() || (cellaRef.current && cellaRef.current.isConnected ? cellaRef.current : null);

  const addRow = () => {
    const cell = cellaAttiva(); if(!cell) return;
    const tr = cell.parentNode, tbody = tr.parentNode;
    const nr = document.createElement('tr');
    for(let i=0;i<tr.children.length;i++){ const td=document.createElement('td'); td.innerHTML='<br>'; nr.appendChild(td); }
    if(tbody.tagName==='THEAD'){
      const table = tbody.parentNode;
      let body = table.querySelector('tbody');
      if(!body){ body=document.createElement('tbody'); table.appendChild(body); }
      body.insertBefore(nr, body.firstChild);
    } else { tbody.insertBefore(nr, tr.nextSibling); }
    emit();
    vaiA(nr.children[Array.prototype.indexOf.call(tr.children, cell)] || nr.children[0]);
  };
  const delRow = () => {
    const cell = cellaAttiva(); if(!cell) return;
    const tr = cell.parentNode;
    if(tr.parentNode.tagName==='THEAD'){ alert('L\'intestazione non si elimina.'); return; }
    const tab = cell.closest('table');
    const idx = Array.prototype.indexOf.call(tr.children, cell);
    const righe = Array.from(tab.querySelectorAll('tr'));
    const ri = righe.indexOf(tr);
    const dopo = righe[ri+1] || righe[ri-1];        // dove portare il cursore
    tr.remove(); emit();
    if(dopo && dopo.children[idx]) vaiA(dopo.children[idx]);
    else if(dopo) vaiA(dopo.children[0]);
    else setTblBox(null);
  };
  const addCol = () => {
    const cell = cellaAttiva(); if(!cell) return;
    const idx = Array.prototype.indexOf.call(cell.parentNode.children, cell);
    const table = cell.closest('table');
    table.querySelectorAll('tr').forEach(tr=>{
      const isHead = tr.parentNode.tagName==='THEAD';
      const el = document.createElement(isHead?'th':'td');
      el.innerHTML = isHead ? 'Colonna' : '<br>';
      tr.insertBefore(el, tr.children[idx+1] || null);
    });
    emit();
  };
  const delCol = () => {
    const cell = cellaAttiva(); if(!cell) return;
    const idx = Array.prototype.indexOf.call(cell.parentNode.children, cell);
    const table = cell.closest('table');
    if(cell.parentNode.children.length<=1){ table.remove(); emit(); setTblBox(null); return; }
    const riga = cell.parentNode;
    table.querySelectorAll('tr').forEach(tr=>{ if(tr.children[idx]) tr.children[idx].remove(); });
    emit();
    const resta = riga.children[idx] || riga.children[idx-1] || riga.children[0];
    if(resta) vaiA(resta); else setTblBox(null);
  };
  const delTable = () => {
    const cell = cellaAttiva(); if(!cell) return;
    if(confirm('Eliminare tutta la tabella?')){
      cell.closest('table').remove(); emit();
      cellaRef.current = null; setInTable(false); setTblBox(null);
    }
  };

  /* annulla e ripeti */
  const annulla = () => { ref.current.focus(); ripristinaRange(); document.execCommand('undo'); emit(); };
  const ripeti  = () => { ref.current.focus(); ripristinaRange(); document.execCommand('redo'); emit(); };

  /* colore di sfondo della cella (o delle celle selezionate) */
  const cellaRef = useRef(null);
  const celleCoinvolte = () => {
    const c = cellaAttiva();
    if(!c) return [];
    const sel = window.getSelection();
    if(sel && sel.rangeCount && !sel.isCollapsed){
      const tab = c.closest('table');
      const tutte = Array.from(tab.querySelectorAll('td,th'));
      const dentro = tutte.filter(td=>sel.containsNode(td, true));
      if(dentro.length) return dentro;
    }
    return [c];
  };
  const coloraCelle = (v) => {
    celleCoinvolte().forEach(td=>{
      if(v) td.style.backgroundColor = v; else td.style.removeProperty('background-color');
    });
    emit(); setPal(null);
  };

  /* larghezza della colonna in cui si trova il cursore */
  const larghezzaColonna = (delta) => {
    const c = cellaAttiva();
    if(!c) return;
    const idx = Array.prototype.indexOf.call(c.parentNode.children, c);
    const tab = c.closest('table');
    const base = c.getBoundingClientRect().width;
    const nuova = Math.max(45, Math.round(base + delta));
    tab.querySelectorAll('tr').forEach(tr=>{
      const cell = tr.children[idx];
      if(cell) cell.style.width = nuova + 'px';
    });
    emit(); setTimeout(checkCtx, 0);
  };
  const larghezzaAuto = () => {
    const c = cellaAttiva();
    if(!c) return;
    const tab = c.closest('table');
    tab.querySelectorAll('td,th').forEach(x=>x.style.removeProperty('width'));
    emit(); setTimeout(checkCtx, 0);
  };

  /* a capo dentro la cella, per chi non ha Maiusc+Invio (telefono) */
  const aCapoInCella = () => {
    ref.current.focus(); ripristinaRange();
    document.execCommand('insertLineBreak');
    emit();
  };

  const pickImage = () => fileRef.current.click();
  const onFile = async (e) => {
    const files = Array.from(e.target.files||[]);
    e.target.value='';
    if(!files.length) return;
    for(const f of files){
      if(!f.type.startsWith('image/')){ alert(`"${f.name}" non è un'immagine. Per video e file usa il pulsante del collegamento.`); continue; }
      setBusy('Comprimo '+f.name+'…');
      try{
        const dataUrl = await compressImage(f);
        const cap = '';
        ref.current.focus();
        document.execCommand('insertHTML', false,
          `<figure><img src="${dataUrl}" alt="${f.name.replace(/"/g,'')}"><figcaption>${cap}</figcaption></figure><p><br></p>`);
        emit();
      }catch(err){ alert('Non sono riuscito a inserire '+f.name); }
    }
    setBusy('');
  };

  const addLink = () => {
    const sel = window.getSelection();
    const testo = sel && sel.toString();
    const url = prompt('Indirizzo del collegamento (va bene anche un video su Drive o YouTube):','https://');
    if(!url || url==='https://') return;
    if(testo){ cmd('createLink', url); }
    else {
      const et = prompt('Testo da mostrare:', url) || url;
      cmd('insertHTML', `<a href="${url.replace(/"/g,'')}">${et}</a>&nbsp;`);
    }
  };

  const peso = kb(value);

  return (
    <div>
      <div className="rt-tools">
        <button onMouseDown={e=>{e.preventDefault(); salvaRange();}} onClick={annulla} title="Annulla (Ctrl/Cmd+Z)">↶</button>
        <button onMouseDown={e=>{e.preventDefault(); salvaRange();}} onClick={ripeti} title="Ripeti (Ctrl/Cmd+Maiusc+Z)">↷</button>
        <span style={{width:1,background:'var(--line)',margin:'2px 5px'}}></span>
        <button onClick={()=>cmd('bold')} title="Grassetto"><b>B</b></button>
        <button onClick={()=>cmd('italic')} title="Corsivo"><i>I</i></button>
        <button onClick={()=>cmd('underline')} title="Sottolineato"><u>U</u></button>
        <button onClick={()=>cmd('formatBlock','<h2>')} title="Titolo">T1</button>
        <button onClick={()=>cmd('formatBlock','<h3>')} title="Sottotitolo">T2</button>
        <button onClick={()=>cmd('formatBlock','<p>')} title="Testo normale">¶</button>
        <button onClick={()=>cmd('insertUnorderedList')} title="Elenco puntato">•—</button>
        <button onClick={()=>cmd('insertOrderedList')} title="Elenco numerato">1—</button>
        <button onClick={()=>cmd('formatBlock','<blockquote>')} title="Citazione">❞</button>
        <span style={{width:1,background:'var(--line)',margin:'2px 5px'}}></span>

        <span className="pal-wrap" onMouseDown={e=>e.preventDefault()} onClick={e=>e.stopPropagation()}>
          <button onClick={()=>setPal(pal==='testo'?null:'testo')} onMouseDown={e=>{e.preventDefault(); salvaRange();}} title="Colore del testo">
            <span className="ink-a">A</span>
          </button>
          {pal==='testo' && (
            <Palette colori={COLORI_TESTO} etichetta="Torna al nero" recenti={recenti}
              onCustom={()=>apriSelettore('testo')}
              onPick={v=>{ ricorda(v); cmdCss('foreColor', v); }}
              onClear={()=>cmdCss('foreColor', '#17211d')}/>
          )}
        </span>

        <span className="pal-wrap" onMouseDown={e=>e.preventDefault()} onClick={e=>e.stopPropagation()}>
          <button onClick={()=>setPal(pal==='evid'?null:'evid')} onMouseDown={e=>{e.preventDefault(); salvaRange();}} title="Evidenziatore">
            <span className="ink-h">A</span>
          </button>
          {pal==='evid' && (
            <Palette colori={COLORI_EVID} evid etichetta="Togli evidenziatore" recenti={recenti}
              onCustom={()=>apriSelettore('evid')}
              onPick={v=>{ ricorda(v); evidenzia(v); }}
              onClear={()=>evidenzia('transparent')}/>
          )}
        </span>

        <span className="pal-wrap" onMouseDown={e=>e.preventDefault()} onClick={e=>e.stopPropagation()}>
          <button onClick={()=>setPal(pal==='riga'?null:'riga')} onMouseDown={e=>{e.preventDefault(); salvaRange();}} title="Spaziatura tra le righe">↕</button>
          {pal==='riga' && (

        onTouchEnd={salvaRange}
        onBlur={salvaRange}
        onFocus={checkCtx}
        onPaste={e=>{
          const dt = e.clipboardData||window.clipboardData;
          const html = dt.getData('text/html');

            e.preventDefault();
            const box = document.createElement('div');
            box.innerHTML = html;

              t.querySelectorAll('*').forEach(el=>{
                ['style','class','width','height','bgcolor','align','valign','id'].forEach(a=>el.removeAttribute(a));
              });

              document.execCommand('insertHTML', false, t.outerHTML + '<p><br></p>');
              emit();
              return;
            }
          }
          e.preventDefault();
          document.execCommand('insertText', false, dt.getData('text/plain'));
        }}
      />

      </div>

      {peso>700 && <div className="peso">Questo documento pesa circa {peso} KB. Oltre il migliaio di KB il salvataggio può rallentare: valuta di togliere qualche foto.</div>}
    </div>
  );
}

/* ═══════════ righe modificabili ═══════════ */
function AutoLine({value, onChange, placeholder, className, onEnter, autofocus}){
  const ref = useRef(null);
  const fit = () => { const el=ref.current; if(!el) return; el.style.height='auto'; el.style.height=(el.scrollHeight)+'px'; };
  useEffect(fit, [value]);
  useEffect(()=>{ const h=()=>fit(); window.addEventListener('resize',h); return ()=>window.removeEventListener('resize',h); },[]);
  useEffect(()=>{
    if(autofocus && ref.current){
      ref.current.focus();
      ref.current.scrollIntoView({block:'center', behavior:'smooth'});
    }
  },[]);
  return (
    <textarea ref={ref} className={className||'line title'} rows={1} value={value} placeholder={placeholder}
      onChange={e=>{ onChange(e.target.value); fit(); }}
      onKeyDown={e=>{
        if(e.key==='Enter' && !e.shiftKey){
          e.preventDefault();
          if(onEnter) onEnter();
        }
      }}/>
  );
}
