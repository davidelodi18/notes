/* ═══════════ app ═══════════ */
function App(){
  const [user,setUser] = useState(HAS_FB? undefined : null);
  const [sezioni,setSezioni] = useState({});
  const [documenti,setDocumenti] = useState({});
  const [pronto,setPronto] = useState(!HAS_FB);

  const [selSez,setSelSez] = useState(null);      // id sezione o 'ATTIVITA'
  const [selDoc,setSelDoc] = useState(null);
  const [q,setQ] = useState('');
  const [modalSez,setModalSez] = useState(null);  // {sezione|null}
  const [modalNew,setModalNew] = useState(false);
  const [salvato,setSalvato] = useState('');
  const [mobileView,setMobileView] = useState('nav'); // nav | doc
  const [menuOpen,setMenuOpen] = useState(false);
  const [pdfBusy,setPdfBusy] = useState(false);
  const [focusId,setFocusId] = useState(null);
  const [fmt,setFmt] = useState(FORMATO_DEF);
  const [modalFmt,setModalFmt] = useState(false);

  useEffect(()=>{
    if(HAS_FB){
      if(!user) return;
      const r = fbDb.ref(ROOT+'/formato');
      const cb = r.on('value', sn=>{ if(sn.val()) setFmt({...FORMATO_DEF, ...sn.val()}); });
      return ()=>r.off('value',cb);
    } else {
      const v = local.get(ROOT+':formato');
      if(v) setFmt({...FORMATO_DEF, ...v});
    }
  },[user]);

  const salvaFmt = (nuovo) => {
    setFmt(nuovo); setModalFmt(false);
    if(HAS_FB) fbDb.ref(ROOT+'/formato').set(nuovo);
    else local.set(ROOT+':formato', nuovo);
  };
  useEffect(()=>{ setMenuOpen(false); },[selDoc,selSez]);
  useEffect(()=>{
    if(!menuOpen) return;
    const h = () => setMenuOpen(false);
    document.addEventListener('click', h);
    return () => document.removeEventListener('click', h);
  },[menuOpen]);
  const [,forceW] = useState(0);
  useEffect(()=>{ const h=()=>forceW(x=>x+1); window.addEventListener('resize',h); return ()=>window.removeEventListener('resize',h); },[]);

  /* auth */
  useEffect(()=>{
    if(!HAS_FB) return;
    return fbAuth.onAuthStateChanged(u=>setUser(u||null));
  },[]);

  /* caricamento dati */
  useEffect(()=>{
    if(HAS_FB){
      if(!user) return;
      const rs = fbDb.ref(ROOT+'/sezioni');
      const rd = fbDb.ref(ROOT+'/documenti');
      const a = rs.on('value', s=>{ setSezioni(s.val()||{}); setPronto(true); });
      const b = rd.on('value', s=>setDocumenti(s.val()||{}));
      return ()=>{ rs.off('value',a); rd.off('value',b); };
    } else {
      setSezioni(local.get(ROOT+':sezioni')||{});
      setDocumenti(local.get(ROOT+':documenti')||{});
      setPronto(true);
    }
  },[user]);

  /* scritture */
  const saveSez = useCallback((id,obj)=>{
    setSezioni(p=>{ const n={...p}; if(obj) n[id]=obj; else delete n[id];
      if(!HAS_FB) local.set(ROOT+':sezioni', n); return n; });
    if(HAS_FB) fbDb.ref(ROOT+'/sezioni/'+id).set(obj||null);
  },[]);

  const saveDoc = useCallback((id,obj)=>{
    setDocumenti(p=>{ const n={...p}; if(obj) n[id]=obj; else delete n[id];
      if(!HAS_FB) local.set(ROOT+':documenti', n); return n; });
    if(HAS_FB) fbDb.ref(ROOT+'/documenti/'+id).set(obj||null);
    setSalvato('Salvato'); setTimeout(()=>setSalvato(''), 1600);
  },[]);

  /* selezione iniziale */
  useEffect(()=>{
    if(!pronto || selSez) return;
    const ids = Object.keys(sezioni);
    if(ids.length){
      ids.sort((a,b)=>(sezioni[a].ordine||0)-(sezioni[b].ordine||0));
      setSelSez(ids[0]);
    }
  },[pronto,sezioni,selSez]);

  /* primo avvio: sezioni di partenza */
  useEffect(()=>{
    if(!pronto) return;
    if(Object.keys(sezioni).length===0 && !local.get(ROOT+':seed')){
      local.set(ROOT+':seed', true);
      [['Controlling','Reporting, chiusure, analisi scostamenti',COLORS[0]],
       ['Riunioni di area','Incontri con le altre funzioni',COLORS[1]],
       ['Idee e appunti','Tutto quello che non ha ancora una casa',COLORS[4]]
      ].forEach(([nome,descrizione,colore],i)=>{
        const id=uid(); saveSez(id,{id,nome,descrizione,colore,ordine:i});
      });
    }
  },[pronto,sezioni,saveSez]);

  const sezList = useMemo(()=>Object.values(sezioni).sort((a,b)=>(a.ordine||0)-(b.ordine||0)),[sezioni]);
  const docList = useMemo(()=>{
    let l = Object.values(documenti);
    if(q.trim()){
      const s=q.toLowerCase();
      l = l.filter(d=>(d.titolo||'').toLowerCase().includes(s)
        || stripHtml(d.corpo).toLowerCase().includes(s)
        || (d.partecipanti||'').toLowerCase().includes(s)
        || (d.agenda||[]).some(p=>(p.titolo+' '+p.note).toLowerCase().includes(s)));
    } else if(selSez && selSez!=='ATTIVITA' && selSez!=='SPAZIO'){
      l = l.filter(d=>d.sezioneId===selSez);
    }
    return l.sort((a,b)=>{
      const da = a.data||a.creato.slice(0,10), db_ = b.data||b.creato.slice(0,10);
      return db_.localeCompare(da);
    });
  },[documenti,selSez,q]);

  const countBySez = useMemo(()=>{
    const c={}; Object.values(documenti).forEach(d=>{c[d.sezioneId]=(c[d.sezioneId]||0)+1;}); return c;
  },[documenti]);

  const azioniAperte = useMemo(()=>{
    const out=[];
    Object.values(documenti).forEach(d=>{
      const az = d.azioni||[];
      const nomeMacro = {};
      az.forEach(a=>{ if(a.macro) nomeMacro[a.id] = a.testo; });
      az.forEach(a=>{
        if(a.macro) return;                       // le macro raggruppano, non sono attività
        if(!a.fatto && (a.testo||'').trim()) out.push({...a, doc:d, macro: a.parentId ? nomeMacro[a.parentId] : null});
      });
    });
    return out.sort((a,b)=>{
      if(!a.scadenza) return 1; if(!b.scadenza) return -1;
      return a.scadenza.localeCompare(b.scadenza);
    });
  },[documenti]);

  const spazio = useMemo(()=>{
    const docs = Object.values(documenti);
    const dettagli = docs.map(d=>{
      const tot = pesoDi(d);
      const img = pesoImmagini(d.corpo);
      return {doc:d, tot, img};
    }).sort((a,b)=>b.tot-a.tot);
    const totale = dettagli.reduce((s,x)=>s+x.tot,0) + pesoDi(sezioni);
    const immagini = dettagli.reduce((s,x)=>s+x.img,0);
    return {dettagli, totale, immagini, testo: Math.max(0, totale-immagini), n: docs.length};
  },[documenti,sezioni]);

  const doc = selDoc ? documenti[selDoc] : null;
  const sezCorrente = doc ? sezioni[doc.sezioneId] : (selSez!=='ATTIVITA'? sezioni[selSez] : null);

  const patchDoc = (patch) => {
    if(!doc) return;
    saveDoc(doc.id, {...doc, ...patch, aggiornato: nowISO()});
  };

  /* editor rich text con debounce */
  const bodyTimer = useRef(null);
  const onBody = (html) => {
    clearTimeout(bodyTimer.current);
    bodyTimer.current = setTimeout(()=>patchDoc({corpo:html}), 700);
  };

  const creaDoc = (tipo,tpl,titolo) => {
    const sid = (selSez && selSez!=='ATTIVITA') ? selSez : (sezList[0]&&sezList[0].id);
    if(!sid){ alert('Crea prima una sezione.'); return; }
    const d = emptyDoc(sid, tipo, tpl);
    d.titolo = titolo || '';
    saveDoc(d.id, d);
    setSelDoc(d.id); setModalNew(false); setMobileView('doc');
  };

  const eliminaDoc = () => {
    if(!doc) return;
    if(confirm(`Eliminare "${doc.titolo||'documento senza titolo'}"?`)){ saveDoc(doc.id,null); setSelDoc(null); }
  };

  const duplicaDoc = () => {
    if(!doc) return;
    const d = {...JSON.parse(JSON.stringify(doc)), id:uid(), titolo:(doc.titolo||'Documento')+' (copia)',
      creato:nowISO(), aggiornato:nowISO(), data: today(), stato:'da preparare'};
    (d.azioni||[]).forEach(a=>{a.fatto=false;});
    saveDoc(d.id,d); setSelDoc(d.id);
  };

  const esportaSezione = async (formato) => {
    const lista = docList;
    if(!lista.length){ alert('Non c\'è niente da esportare.'); return; }
    const titolo = q.trim()? `Ricerca "${q}"` : (sezCorrente? sezCorrente.nome : 'Quaderno');
    const inner = `<h1>${titolo}</h1>` + lista.map(d=>'<div class="doc-sep">'+docToHtml(d, sezioni[d.sezioneId])+'</div>').join('');
    if(formato==='word'){ exportWord(titolo, titolo, inner, fmt); return; }
    setPdfBusy(true);
    await exportPdf(titolo, inner, titolo, fmt);
    setPdfBusy(false);
  };

  if(user===undefined) return <div style={{padding:40,color:'var(--muted)'}}>Caricamento…</div>;
  if(HAS_FB && !user) return <Login/>;

  /* ── colonna documento ── */
  const renderDoc = () => {
    if(selSez==='SPAZIO'){
      const perc = spazio.totale / LIMITE_DB * 100;
      const cls = perc > 80 ? ' alarm' : perc > 50 ? ' warn' : '';
      const quotaImg = spazio.totale ? Math.round(spazio.immagini/spazio.totale*100) : 0;
      return (
        <div className="actions-wrap">
          <h1 style={{fontFamily:'var(--serif)',fontSize:30,margin:'0 0 4px'}}>Spazio</h1>
          <p style={{color:'var(--muted)',marginTop:0}}>Quanto stanno occupando i tuoi documenti sul database.</p>

          <div className="spazio-hero">
            <div className="spazio-num">
              {fmtPeso(spazio.totale)}<small>su 1 GB disponibili</small>
            </div>
            <div className="barra"><i className={cls} style={{width: Math.max(0.4, Math.min(100, perc))+'%'}}></i></div>
            <div className="spazio-sub">
              {perc < 0.1 ? 'Meno dello 0,1% dello spazio' : `${perc.toFixed(perc<1?2:1).replace('.',',')}% dello spazio`}
              {' · '}restano {fmtPeso(Math.max(0, LIMITE_DB - spazio.totale))}
            </div>
          </div>

          <div className="quote">
            <div className="quota"><div className="k">Documenti</div><div className="v">{spazio.n}</div></div>
            <div className="quota"><div className="k">Testo</div><div className="v">{fmtPeso(spazio.testo)}</div></div>
            <div className="quota"><div className="k">Immagini</div><div className="v">{fmtPeso(spazio.immagini)}</div></div>
            <div className="quota"><div className="k">Peso medio</div><div className="v">{spazio.n? fmtPeso(Math.round(spazio.totale/spazio.n)) : '—'}</div></div>
          </div>

          {spazio.immagini > 0 && (
            <p className="spazio-sub" style={{marginTop:4}}>
              Le foto sono il {quotaImg}% del totale: è quasi sempre lì che cresce lo spazio.
            </p>
          )}

          <div className="sec-h"><h3>Documenti più pesanti</h3><div className="rule"></div></div>
          {spazio.dettagli.length===0 && <div className="empty"><strong>Ancora niente</strong>Il conto parte dal primo documento.</div>}
          {spazio.dettagli.slice(0,8).map(x=>(
            <div className="top-doc" key={x.doc.id}>
              <button className="link-btn t" style={{textAlign:'left'}}
                onClick={()=>{setSelSez(x.doc.sezioneId); setSelDoc(x.doc.id); setMobileView('doc');}}>
                {x.doc.titolo || 'Senza titolo'}
              </button>
              {x.img > 0 && <span className="img">{fmtPeso(x.img)} di foto</span>}
              <span className="p">{fmtPeso(x.tot)}</span>
            </div>
          ))}

          <div className="nota-box">
            Il conto è una stima calcolata sui documenti che hai qui: il valore ufficiale sta nella console
            Firebase, sotto Realtime Database → Utilizzo, e sarà un po' più alto perché include anche
            la struttura interna del database.<br/><br/>
            Oltre al limite di 1 GB, il piano gratuito dà 10 GB di traffico al mese. Ogni volta che apri
            l'app scarichi tutti i documenti, quindi con appunti di solo testo sei lontanissimo dal limite,
            mentre molte foto pesanti lo consumano più in fretta.
          </div>
        </div>
      );
    }

    if(selSez==='ATTIVITA'){
      return (
        <div className="actions-wrap">
          <h1 style={{fontFamily:'var(--serif)',fontSize:30,margin:'0 0 4px'}}>Attività aperte</h1>
          <p style={{color:'var(--muted)',marginTop:0}}>Tutto quello che è rimasto da fare, da tutte le riunioni.</p>
          {azioniAperte.length===0 && <div className="empty"><strong>Niente in sospeso</strong>Le attività che segni nelle riunioni compaiono qui.</div>}
          {azioniAperte.map(a=>{
            const dd = daysTo(a.scadenza);
            const cls = dd===null? '' : dd<0? ' late' : dd<=3? ' soon' : '';
            return (
              <div className="act" key={a.id}>
                <input type="checkbox" className="chk" style={{marginTop:2}} onChange={()=>{
                  const d = a.doc;
                  saveDoc(d.id, {...d, azioni:d.azioni.map(x=>x.id===a.id?{...x,fatto:true}:x), aggiornato:nowISO()});
                }}/>
                <div style={{flex:1,minWidth:0}}>
                  <div>{a.testo}</div>
                  <div className="src">
                    {a.macro && <span className="who">{a.macro} › </span>}
                    {a.responsabile && <span className="who">{a.responsabile} · </span>}
                    <button className="link-btn" onClick={()=>{setSelSez(a.doc.sezioneId); setSelDoc(a.doc.id); setMobileView('doc');}}>
                      {a.doc.titolo||'Documento senza titolo'}
                    </button>
                  </div>
                </div>
                <div className={'due'+cls}>
                  {a.scadenza ? fmtDate(a.scadenza) + (dd<0? ` · ${-dd}g fa` : dd===0? ' · oggi' : '') : '—'}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    if(!doc) return (
      <div className="empty" style={{paddingTop:'22vh'}}>
        <strong>Nessun documento aperto</strong>
        Scegli un documento a sinistra, oppure creane uno nuovo.
      </div>
    );

    const isMeet = doc.tipo==='riunione';
    const inner = () => docToHtml(doc, sezioni[doc.sezioneId]);
    const fname = (doc.titolo||'documento') + (doc.data? ' '+doc.data : '');

    return (
      <>
        <div className="doc-bar">
          <button className="btn ghost sm mobile-back" onClick={()=>setMobileView('nav')}>← Elenco</button>
          {isMeet && (
            <select className="btn sm" value={doc.stato} onChange={e=>patchDoc({stato:e.target.value})}>
              <option>da preparare</option><option>preparata</option><option>svolta</option>
            </select>
          )}
          <span className="spacer"></span>
          <span className="saved">{salvato}</span>
          <button className="btn sm" onClick={()=>exportWord(fname, doc.titolo||'Documento', inner(), fmt)}>Word</button>
          <button className="btn sm" disabled={pdfBusy} onClick={async()=>{
            setPdfBusy(true);
            await exportPdf(doc.titolo||'Documento', inner(), fname, fmt);
            setPdfBusy(false);
          }}>{pdfBusy ? 'PDF…' : 'PDF'}</button>
          <button className="btn ghost sm hide-mobile" onClick={duplicaDoc} title="Duplica come nuovo">Duplica</button>
          <button className="btn ghost sm danger hide-mobile" onClick={eliminaDoc}>Elimina</button>
          <div className="doc-menu" onClick={e=>e.stopPropagation()}>
            <button className="btn ghost sm" onClick={e=>{e.stopPropagation(); setMenuOpen(o=>!o);}} title="Altro">⋯</button>
            {menuOpen && (
              <div className="doc-menu-pop">
                <button onClick={()=>{setMenuOpen(false); setModalFmt(true);}}>Formato export…</button>
                <button onClick={()=>{setMenuOpen(false); duplicaDoc();}}>Duplica</button>
                <button className="danger" onClick={()=>{setMenuOpen(false); eliminaDoc();}}>Elimina</button>
              </div>
            )}
          </div>
        </div>

        <div className="doc">
          <input className="title-in" value={doc.titolo} placeholder="Titolo del documento"
            onChange={e=>patchDoc({titolo:e.target.value})}/>

          <div className="meta-grid">
            <div className="f">
              <label>Sezione</label>
              <select value={doc.sezioneId} onChange={e=>patchDoc({sezioneId:e.target.value})}>
                {sezList.map(s=><option key={s.id} value={s.id}>{s.nome}</option>)}
              </select>
            </div>
            <div className="f"><label>Data</label>
              <input type="date" value={doc.data||''} onChange={e=>patchDoc({data:e.target.value})}/></div>
            {isMeet && <div className="f"><label>Ora</label>
              <input type="time" value={doc.ora||''} onChange={e=>patchDoc({ora:e.target.value})}/></div>}
            {isMeet && <div className="f"><label>Luogo</label>
              <input value={doc.luogo||''} placeholder="Sala, Teams…" onChange={e=>patchDoc({luogo:e.target.value})}/></div>}
            {isMeet && <div className="f" style={{gridColumn:'1 / -1'}}><label>Partecipanti</label>
              <input value={doc.partecipanti||''} placeholder="Nomi separati da virgola"
                onChange={e=>patchDoc({partecipanti:e.target.value})}/></div>}
            <div className="f" style={{gridColumn:'1 / -1'}}>
              <label>{isMeet?'Obiettivo della riunione':'In sintesi'}</label>
              <input value={doc.obiettivo||''} placeholder={isMeet?'Cosa deve uscire da questo incontro':'Una riga per ricordarti di cosa parla'}
                onChange={e=>patchDoc({obiettivo:e.target.value})}/>
            </div>
          </div>

          {isMeet && (
            <>
              <div className="sec-h"><h3>Ordine del giorno</h3><div className="rule"></div></div>
              {(doc.agenda||[]).map((p,i)=>(
                <AgendaRow key={p.id} p={p} i={i}
                  autofocus={focusId===p.id}
                  onEnter={()=>{
                    const nuovo={id:uid(),titolo:'',note:''};
                    const a=(doc.agenda||[]).slice(); a.splice(i+1,0,nuovo);
                    patchDoc({agenda:a}); setFocusId(nuovo.id);
                  }}
                  mv={{
                    onUp:()=>{ const a=doc.agenda.slice(); [a[i-1],a[i]]=[a[i],a[i-1]]; patchDoc({agenda:a}); },
                    onDown:()=>{ const a=doc.agenda.slice(); [a[i+1],a[i]]=[a[i],a[i+1]]; patchDoc({agenda:a}); },
                    primo: i===0, ultimo: i===doc.agenda.length-1
                  }}
                  onChange={np=>patchDoc({agenda:doc.agenda.map(x=>x.id===p.id?np:x)})}
                  onRemove={()=>patchDoc({agenda:doc.agenda.filter(x=>x.id!==p.id)})}/>
              ))}
              <button className="add-line" onClick={()=>{
                const n={id:uid(),titolo:'',note:''};
                patchDoc({agenda:[...(doc.agenda||[]), n]}); setFocusId(n.id);
              }}>+ Aggiungi punto</button>
            </>
          )}

          <div className="sec-h"><h3>{isMeet?'Note della riunione':'Appunti'}</h3><div className="rule"></div></div>
          <RichText docKey={doc.id} value={doc.corpo} onChange={onBody}
            placeholder={isMeet?'Cosa è stato detto, numeri, osservazioni…':'Scrivi qui…'}/>

          {isMeet && (
            <>
              <div className="sec-h"><h3>Decisioni</h3><div className="rule"></div></div>
              {(doc.decisioni||[]).map((d,i)=>(
                <div className="row" key={d.id}>
                  <div className="num">{i+1}</div>
                  <div className="body">
                    <AutoLine value={d.testo} placeholder="Cosa è stato deciso"
                      autofocus={focusId===d.id}
                      onEnter={()=>{
                        const nuova={id:uid(),testo:''};
                        const a=(doc.decisioni||[]).slice(); a.splice(i+1,0,nuova);
                        patchDoc({decisioni:a}); setFocusId(nuova.id);
                      }}
                      onChange={v=>patchDoc({decisioni:doc.decisioni.map(x=>x.id===d.id?{...x,testo:v}:x)})}/>
                  </div>
                  <Frecce primo={i===0} ultimo={i===doc.decisioni.length-1}
                    onUp={()=>{ const a=doc.decisioni.slice(); [a[i-1],a[i]]=[a[i],a[i-1]]; patchDoc({decisioni:a}); }}
                    onDown={()=>{ const a=doc.decisioni.slice(); [a[i+1],a[i]]=[a[i],a[i+1]]; patchDoc({decisioni:a}); }}/>
                  <button className="x" onClick={()=>patchDoc({decisioni:doc.decisioni.filter(x=>x.id!==d.id)})}>✕</button>
                </div>
              ))}
              <button className="add-line" onClick={()=>{
                const n={id:uid(),testo:''};
                patchDoc({decisioni:[...(doc.decisioni||[]), n]}); setFocusId(n.id);
              }}>+ Aggiungi decisione</button>
            </>
          )}

          <div className="sec-h"><h3>Attività</h3><div className="rule"></div></div>
          {(() => {
            const az = doc.azioni || [];
            const set = (nuove) => patchDoc({azioni:nuove});
            const upd = (id, nv) => set(az.map(x=>x.id===id?nv:x));
            const figlie = (mid) => az.filter(x=>!x.macro && x.parentId===mid);
            const nuovaAz = (parentId=null) => ({id:uid(),testo:'',note:'',responsabile:'',scadenza:'',fatto:false,parentId});

            // blocchi di primo livello: una macro con le sue figlie, oppure un'attività singola
            const blocchi = [];
            az.forEach(a=>{
              if(a.macro) blocchi.push({capo:a, figlie:figlie(a.id)});
              else if(!a.parentId) blocchi.push({capo:a, figlie:[]});
            });
            const appiattisci = (bl) => bl.reduce((acc,b)=>acc.concat([b.capo], b.figlie), []);

            const muoviBlocco = (i, d) => {
              const j = i + d;
              if(j<0 || j>=blocchi.length) return;
              const bl = blocchi.slice();
              [bl[i], bl[j]] = [bl[j], bl[i]];
              set(appiattisci(bl));
            };
            const muoviFiglia = (bi, fi, d) => {
              const j = fi + d;
              const b = blocchi[bi];
              if(j<0 || j>=b.figlie.length) return;
              const bl = blocchi.map((x,k)=> k===bi ? {capo:x.capo, figlie:x.figlie.slice()} : x);
              const f = bl[bi].figlie;
              [f[fi], f[j]] = [f[j], f[fi]];
              set(appiattisci(bl));
            };

            const inserisciBlocco = (i) => {          // nuova attività di primo livello dopo il blocco i
              const nuova = nuovaAz();
              const bl = blocchi.slice();
              bl.splice(i+1, 0, {capo:nuova, figlie:[]});
              set(appiattisci(bl)); setFocusId(nuova.id);
            };
            const inserisciFiglia = (bi, pos) => {    // nuova sotto-attività dentro la macro bi
              const nuova = nuovaAz(blocchi[bi].capo.id);
              const bl = blocchi.map((x,k)=> k===bi ? {capo:{...x.capo, chiusa:false}, figlie:x.figlie.slice()} : x);
              bl[bi].figlie.splice(pos, 0, nuova);
              set(appiattisci(bl)); setFocusId(nuova.id);
            };

            return (
              <>
                {blocchi.map((b, i) => {
                  const mvBlocco = {
                    onUp:()=>muoviBlocco(i,-1), onDown:()=>muoviBlocco(i,1),
                    primo: i===0, ultimo: i===blocchi.length-1
                  };
                  if(!b.capo.macro){
                    return (
                      <ActionRow key={b.capo.id} a={b.capo} mv={mvBlocco}
                        autofocus={focusId===b.capo.id}
                        onEnter={()=>inserisciBlocco(i)}
                        onChange={nv=>upd(b.capo.id,nv)}
                        onRemove={()=>set(az.filter(x=>x.id!==b.capo.id))}/>
                    );
                  }
                  return (
                    <div key={b.capo.id}>
                      <MacroRow m={b.capo} totali={b.figlie.length} fatte={b.figlie.filter(x=>x.fatto).length}
                        mv={mvBlocco}
                        autofocus={focusId===b.capo.id}
                        chiusa={!!b.capo.chiusa}
                        onToggle={()=>upd(b.capo.id, {...b.capo, chiusa: !b.capo.chiusa})}
                        onEnter={()=>inserisciFiglia(i, b.figlie.length)}
                        onChange={nv=>upd(b.capo.id,nv)}
                        onAdd={()=>inserisciFiglia(i, b.figlie.length)}
                        onRemove={()=>{
                          if(b.figlie.length && !confirm(`Eliminare "${b.capo.testo||'la macro-attività'}" e le sue ${b.figlie.length} sotto-attività?`)) return;
                          set(az.filter(x=>x.id!==b.capo.id && x.parentId!==b.capo.id));
                        }}/>
                      {!b.capo.chiusa && b.figlie.map((c, fi)=>(
                        <ActionRow key={c.id} a={c} sub
                          autofocus={focusId===c.id}
                          onEnter={()=>inserisciFiglia(i, fi+1)}
                          mv={{
                            onUp:()=>muoviFiglia(i,fi,-1), onDown:()=>muoviFiglia(i,fi,1),
                            primo: fi===0, ultimo: fi===b.figlie.length-1
                          }}
                          onChange={nv=>upd(c.id,nv)}
                          onRemove={()=>set(az.filter(x=>x.id!==c.id))}/>
                      ))}
                    </div>
                  );
                })}
                <div className="add-row">
                  <button className="add-line" onClick={()=>{ const n=nuovaAz(); set([...az,n]); setFocusId(n.id); }}>+ Aggiungi attività</button>
                  <button className="add-line alt" onClick={()=>{ const n={id:uid(),testo:'',note:'',macro:true}; set([...az,n]); setFocusId(n.id); }}>+ Aggiungi macro-attività</button>
                </div>
              </>
            );
          })()}
        </div>
      </>
    );
  };

  const mobileHide = (col) => (window.innerWidth<=900 && mobileView==='doc' && col!=='doc') ? ' hide-m'
    : (window.innerWidth<=900 && mobileView==='nav' && col==='doc') ? ' hide-m' : '';

  return (
    <div className="app">
      {/* colonna sezioni */}
      <div className={'col-sections'+mobileHide('nav')}>
        <div className="brand">
          <span className={'dot'+(HAS_FB?'':' off')} title={HAS_FB?'Sincronizzato':'Solo su questo dispositivo'}></span>
          <h1>Quaderno</h1>
        </div>
        <div className="nav">
          <div className="nav-group">
            <button className={'nav-item'+(selSez==='ATTIVITA'?' on':'')} onClick={()=>{setSelSez('ATTIVITA');setSelDoc(null);setQ('');setMobileView('doc');}}>
              <span className="chip" style={{background:'var(--amber)'}}></span>
              <span className="name">Attività aperte</span>
              <span className="n">{azioniAperte.length||''}</span>
            </button>
            <button className={'nav-item'+(selSez==='SPAZIO'?' on':'')} onClick={()=>{setSelSez('SPAZIO');setSelDoc(null);setQ('');setMobileView('doc');}}>
              <span className="chip" style={{background:'var(--muted)'}}></span>
              <span className="name">Spazio</span>
              <span className="n">{fmtPeso(spazio.totale)}</span>
            </button>
          </div>
          <div className="nav-group">
            <div className="nav-label">Sezioni</div>
            {sezList.map(s=>(
              <button key={s.id} className={'nav-item'+(selSez===s.id?' on':'')}
                onClick={()=>{setSelSez(s.id);setSelDoc(null);setQ('');}}>
                <span className="chip" style={{background:s.colore}}></span>
                <span className="name">{s.nome}</span>
                <span className="n">{countBySez[s.id]||''}</span>
                <span className="edit" onClick={e=>{e.stopPropagation(); setModalSez({sezione:s});}}>✎</span>
              </button>
            ))}
            <button className="nav-add" onClick={()=>setModalSez({sezione:null})}>+ Nuova sezione</button>
          </div>
        </div>
        <div className="sidebar-foot">
          <button onClick={()=>setModalFmt(true)}>Formato export</button>
          {HAS_FB && <button onClick={()=>fbAuth.signOut()}>Esci</button>}
        </div>
      </div>

      {/* colonna elenco */}
      <div className={'col-list'+mobileHide('list')}>
        <div className="list-head">
          <h2>{q.trim()? 'Risultati' : selSez==='ATTIVITA'? 'Attività' : selSez==='SPAZIO'? 'Spazio' : (sezCorrente? sezCorrente.nome : 'Documenti')}</h2>
          <p>{q.trim()? `${docList.length} documenti trovati`
             : selSez==='SPAZIO' ? 'Occupazione del database'
             : selSez==='ATTIVITA' ? 'Vista trasversale'
             : (sezCorrente&&sezCorrente.descrizione) || `${docList.length} documenti`}</p>
          <input className="search" value={q} onChange={e=>setQ(e.target.value)} placeholder="Cerca in tutto il quaderno…"/>
        </div>
        <div className="new-row">
          <button className="btn primary sm" style={{flex:1}} onClick={()=>setModalNew(true)}>+ Nuovo documento</button>
          <button className="btn sm" onClick={()=>esportaSezione('word')} title="Esporta l'elenco in Word">Word</button>
          <button className="btn sm" disabled={pdfBusy} onClick={()=>esportaSezione('pdf')} title="Esporta l'elenco in PDF">{pdfBusy?'PDF…':'PDF'}</button>
        </div>
        <div className="list">
          {docList.length===0 && (
            <div className="empty">
              <strong>{q.trim()?'Nessun risultato':'Sezione vuota'}</strong>
              {q.trim()?'Prova con un\'altra parola.':'Crea il primo documento per iniziare.'}
            </div>
          )}
          {docList.map(d=>{
            const aperte = (d.azioni||[]).filter(a=>!a.fatto && a.testo.trim()).length;
            return (
              <button key={d.id} className={'card'+(selDoc===d.id?' on':'')}
                onClick={()=>{setSelDoc(d.id); setMobileView('doc');}}>
                <div className="t">{d.titolo||'Senza titolo'}</div>
                <div className="m">
                  {d.data && <span>{fmtDate(d.data)}</span>}
                  {d.tipo==='riunione' && <span className="tag meet">{d.stato||'riunione'}</span>}
                  {aperte>0 && <span className="tag todo">{aperte} da fare</span>}
                  {q.trim() && sezioni[d.sezioneId] && <span>{sezioni[d.sezioneId].nome}</span>}
                </div>
              </button>
            );
          })}
        </div>
      </div>

      {/* colonna documento */}
      <div className={'col-doc'+mobileHide('doc')}>{renderDoc()}</div>

      {modalSez && (
        <SectionModal
          sezione={modalSez.sezione}
          count={modalSez.sezione? (countBySez[modalSez.sezione.id]||0) : 0}
          onClose={()=>setModalSez(null)}
          onSave={vals=>{
            if(modalSez.sezione){ saveSez(modalSez.sezione.id, {...modalSez.sezione, ...vals}); }
            else { const id=uid(); saveSez(id,{id,...vals,ordine:sezList.length}); setSelSez(id); }
            setModalSez(null);
          }}
          onDelete={()=>{
            const sid = modalSez.sezione.id;
            Object.values(documenti).filter(d=>d.sezioneId===sid).forEach(d=>saveDoc(d.id,null));
            saveSez(sid,null); setModalSez(null);
            if(selSez===sid){ setSelSez(null); setSelDoc(null); }
          }}/>
      )}
      {modalNew && <NewDocModal onCreate={creaDoc} onClose={()=>setModalNew(false)}/>}
      {modalFmt && <FormatoModal fmt={fmt} onSave={salvaFmt} onClose={()=>setModalFmt(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
